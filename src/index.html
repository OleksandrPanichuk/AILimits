<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claude Limits</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="panel">
      <header>
        <div class="title">
          <span class="brand">Claude</span>
          <span id="plan" class="chip" hidden></span>
        </div>
        <div class="actions">
          <span id="updated" class="muted"></span>
          <button id="refresh" title="Refresh now" aria-label="Refresh now">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
              <path d="M13.5 8a5.5 5.5 0 1 1-1.61-3.89M13.5 2.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </header>
      <div id="error" class="error" hidden></div>
      <section id="limits"></section>
      <footer>
        <span class="muted legend"><i class="tick-sample"></i> even pace</span>
        <button id="quit" class="link">Quit</button>
      </footer>
    </main>
    <script src="main.js"></script>
  </body>
</html>
